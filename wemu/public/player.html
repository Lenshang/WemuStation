<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>WemuStation Player</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center; color: #9ca3af;
      font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
      z-index: 10; transition: opacity .4s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spin { width: 34px; height: 34px; border: 3px solid #374151; border-top-color: #a78bfa; border-radius: 50%; animation: sp 1s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="spin"></div><div id="loading-text">正在加载核心…</div></div>
  <div id="game"></div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var core = q.get('core') || 'nes';
      var gameUrl = q.get('game') || '';
      var gameName = q.get('name') || 'game';

      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameUrl = gameUrl;
      window.EJS_gameName = gameName;
      window.EJS_pathtodata = '/emulatorjs/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_backgroundColor = '#0a0a0f';
      window.EJS_color = '#a78bfa';
      window.EJS_disableAutoLang = false;
      window.EJS_defaultOptions = { 'save-state-location': 'browser' };
      // hide EmulatorJS exit button; exiting is owned by the frontend shell
      window.EJS_Buttons = {
        playPause: true, restart: true, mute: true, settings: true, fullscreen: true,
        saveState: true, loadState: true, screenRecord: true, gamepad: true, cheat: true,
        volume: true, saveSavFiles: true, loadSavFiles: true, quickSave: true, quickLoad: true,
        screenshot: true, cacheManager: true, exitEmulation: false, diskButton: true, netplay: false
      };
      window.EJS_ready = function () { parent.postMessage({ type: 'ejs-ready' }, '*'); };
      window.EJS_onGameStart = function () {
        var l = document.getElementById('loading');
        if (l) l.classList.add('hide');
        parent.postMessage({ type: 'ejs-start' }, '*');
      };
      window.EJS_onSaveState = function (e) { parent.postMessage({ type: 'ejs-savestate' }, '*'); };
      window.EJS_onLoadState = function () { parent.postMessage({ type: 'ejs-loadstate' }, '*'); };
      // Esc inside the iframe bubbles up as an exit request
      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') parent.postMessage({ type: 'ejs-esc' }, '*');
      });
      window.addEventListener('error', function (ev) {
        parent.postMessage({ type: 'ejs-error', message: String(ev.message || 'unknown error') }, '*');
      });
      var s = document.createElement('script');
      s.src = '/emulatorjs/data/loader.js';
      s.onerror = function () {
        parent.postMessage({ type: 'ejs-error', message: '无法加载 EmulatorJS loader.js' }, '*');
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
